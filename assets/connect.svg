<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
<title id="title">Let's Connect — TahmidCZ</title><desc id="desc">Black and neon violet cyberpunk profile graphic for MD Tahmidul Islam.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080610"/><stop offset=".55" stop-color="#160b2a"/><stop offset="1" stop-color="#090611"/></linearGradient>
 <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#6d28d9"/><stop offset=".5" stop-color="#d8b4fe"/><stop offset="1" stop-color="#7c3aed"/></linearGradient>
 <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#8b5cf6" stroke-opacity=".12" stroke-width="1"/></pattern>
</defs>
<rect width="1200" height="360" rx="24" fill="url(#bg)"/><rect width="1200" height="360" rx="24" fill="url(#grid)"/>
<path d="M20 58H1180 M20 302H1180" stroke="url(#line)" stroke-width="2" opacity=".8" filter="url(#glow)"/>
<path d="M30 30h110l-18 18H30z M1170 330h-110l18-18h92z" fill="#a855f7" opacity=".65"/>

<text x="64" y="90" fill="#c4b5fd" font-family="Arial,sans-serif" font-size="14" letter-spacing="4">OPEN CHANNEL / 05</text>
<text x="64" y="158" fill="#fff" font-family="Arial,sans-serif" font-size="42" font-weight="800" filter="url(#glow)">LET'S CONNECT</text>
<text x="66" y="202" fill="#ddd6fe" font-family="Arial,sans-serif" font-size="19">Have an idea or want to say hello?</text>
<text x="66" y="248" fill="#c084fc" font-family="Arial,sans-serif" font-size="18">GITHUB  •  EMAIL</text>
